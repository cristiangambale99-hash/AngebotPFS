<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Reinigungsvertrag – Clean Service Scaramuzzo AG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --teal:#2BB6B7; --teal-deep:#1C7878; --tint:#EAF6F6;
  --bg:#FCFDFD; --surface:#FFFFFF; --wash:#F2F8F8;
  --border:#E1EAE9; --border-soft:#E8F0EF;
  --ink:#0E1E1D; --body-c:#485655; --mute:#7C8C8B;
  --head:'Poppins',sans-serif; --body:'Mulish',sans-serif;
  color-scheme:light only;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--body-c);font-family:var(--body);
  font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased;}

.leiste{background:var(--surface);border-bottom:1px solid var(--border-soft);}
.leiste .in{max-width:820px;margin:0 auto;padding:14px 26px;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap;}
.leiste .tx{flex:1;font-size:13px;color:var(--mute);}
.btn{font-family:var(--head);font-weight:600;font-size:13.5px;color:#fff;background:var(--teal);
  border:none;border-radius:100px;padding:10px 22px;cursor:pointer;text-decoration:none;display:inline-block;}
.btn:hover{background:var(--teal-deep);}
.btn.zweit{background:var(--surface);color:var(--teal-deep);border:1px solid var(--border);}
.btn.zweit:hover{background:var(--tint);}

.blatt{max-width:820px;margin:26px auto 70px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:14px;padding:46px 54px 54px;}
h1{font-family:var(--head);font-weight:700;color:var(--ink);font-size:20px;letter-spacing:.01em;
  margin:0 0 26px;text-transform:uppercase;}
h1 span{color:var(--teal-deep);}
.paar{display:grid;grid-template-columns:150px 1fr;gap:4px 18px;margin-bottom:20px;}
.paar dt{font-size:13px;color:var(--mute);}
.paar dd{margin:0;font-size:14.5px;color:var(--ink);font-weight:600;}
.trenn{border:none;border-top:1px solid var(--border);margin:24px 0;}
.abs{margin:0 0 14px;}
.klein{font-size:13px;color:var(--mute);}
.wichtig{background:var(--tint);border:1px solid #CFE7E7;border-radius:10px;
  padding:14px 17px;margin:20px 0;font-size:13.5px;color:var(--body-c);}
.unter{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:44px;}
.unter .sp{font-size:13px;}
.unter .li{border-bottom:1px solid var(--ink);height:44px;margin-bottom:6px;}
.unter b{display:block;color:var(--ink);font-family:var(--head);}
.sig-bild{height:46px;display:block;margin:0 0 -6px 2px;}
.sig-feld{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;}
.sig-feld canvas{display:block;width:100%;height:130px;touch-action:none;cursor:crosshair;}
.sig-leiste{display:flex;justify-content:space-between;align-items:center;
  padding:6px 10px;background:var(--wash);border-top:1px solid var(--border-soft);}
.sig-leiste span{font-size:11.5px;color:var(--mute);}
.sig-leiste button{border:none;background:none;font-family:inherit;font-size:12px;
  color:var(--teal-deep);cursor:pointer;padding:2px 6px;}
.senden{margin-top:26px;padding:20px 22px;background:var(--tint);border:1px solid #CFE7E7;border-radius:12px;}
.senden h3{font-family:var(--head);font-weight:600;font-size:15px;color:var(--ink);margin:0 0 8px;}
.senden .zeile{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;}
.senden label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px;}
.senden input{font-family:inherit;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--border);border-radius:9px;background:var(--surface);}
.senden .mld{margin-top:12px;font-size:13px;}
@media print{ .senden{display:none;} }
.fehler{max-width:820px;margin:60px auto;text-align:center;color:var(--mute);}

@media print{
  .leiste{display:none;}
  body{background:#fff;font-size:11pt;}
  .blatt{margin:0;border:none;border-radius:0;padding:0;max-width:none;}
  h1{font-size:15pt;}
}
@media (max-width:620px){
  .blatt{padding:28px 22px 34px;}
  .paar{grid-template-columns:1fr;gap:0 0;}
  .paar dd{margin-bottom:10px;}
  .unter{grid-template-columns:1fr;gap:24px;}
}
</style>
</head>
<body>

<div class="leiste">
  <div class="in">
    <span class="tx" id="leiste-tx">Reinigungsvertrag</span>
    <button class="btn" onclick="window.print()">Drucken oder als PDF speichern</button>
    <a class="btn zweit" id="zurueck" href="index.html">Zum Konzept</a>
  </div>
</div>

<div id="inhalt"></div>

<script>
/* ============================================================
   Vertragsseite

   Baut den Reinigungsvertrag aus den gespeicherten Auftragsdaten
   auf. Aufruf mit signiertem Link:
     vertrag.html?id=<Auftragsnummer>&sig=<Signatur>&spr=de|en
   Ohne gültige Signatur wird nichts angezeigt.
   ============================================================ */
const P = new URLSearchParams(location.search);
const SPR = P.get('spr') === 'en' ? 'en' : 'de';
document.documentElement.lang = SPR;

/* Stundensätze gemäss Angebot */
const ANSATZ = {
  monatlich:     { inkl: 48.65, exkl: 45.00 },
  standard:      { inkl: 42.15, exkl: 39.00 }
};
const FREQ_TEXT = {
  de: { woechentlich:'1-mal pro Woche', '14-taeglich':'1-mal alle zwei Wochen', monatlich:'1-mal pro Monat' },
  en: { woechentlich:'once a week',     '14-taeglich':'once every two weeks',   monatlich:'once a month' }
};

const T = SPR === 'en' ? {
  titel:'Cleaning contract no.', ag:'Client', an:'Contractor',
  freq:'Cleaning frequency', aufwand:'Time per visit',
  umfang:'The scope of services can be adjusted at any time by mutual agreement. The minimum time per visit is two hours.',
  beginn:'Start of contract', beginnTx:'The contractual relationship enters into force upon signature by both parties.',
  start:'Start date', satz:'Hourly rate for private household cleaning',
  mwst:'The hourly rates are exclusive of VAT.',
  agb:'The general terms and conditions form part of this contract. By signing, the client confirms having read and understood them and agreeing to their content.',
  hinweis:'You are very welcome to return the contract signed. With the start of the service, however, the contract is deemed valid and accepted in all cases.',
  anTitel:'The contractor', agTitel:'The client', ort:'Place / date', unterschrift:'Signature',
  gf:'Managing Director', al:'Head of Department', leiste:'Cleaning contract',
  zeichnen:'Please sign in the field', loeschen:'Clear',
  sendenT:'Sign and return online', ortFeld:'Place',
  sendenTx:'Sign in the field above, then send the contract back to us with one click. You may of course also print it and return it by post.',
  sendenKnopf:'Send signed contract', sendet:'Sending …',
  fehltSig:'Please sign in the field first.',
  dankeT:'Thank you', dankeTx:'We have received your signed contract. You will receive a copy by e-mail.',
  pech:'It could not be sent:',
  fehlerT:'This link is not valid', fehler:'Please contact us: T 0844 355 355.'
} : {
  titel:'Reinigungsvertrag Nr.', ag:'Auftraggeber', an:'Auftragnehmer',
  freq:'Reinigungsfrequenz', aufwand:'Reinigungsaufwand',
  umfang:'Der Leistungsumfang kann im gegenseitigen Einverständnis jederzeit angepasst werden. Der Mindesteinsatz pro Reinigung beträgt 2 Stunden.',
  beginn:'Vertragsbeginn', beginnTx:'Das Vertragsverhältnis tritt mit beidseitiger Vertragsunterzeichnung in Kraft.',
  start:'Startdatum', satz:'Stundensatz für die Privathaushaltreinigung',
  mwst:'Die Stundensätze sind exkl. der Mehrwertsteuer zu verstehen.',
  agb:'Die Allgemeinen Geschäftsbedingungen sind Bestandteil dieses Vertrages. Der Kunde erklärt mit seiner Unterschrift, die AGB gelesen und verstanden zu haben sowie mit dem Inhalt einverstanden zu sein.',
  hinweis:'Sehr gerne kann der Vertrag unterschrieben retourniert werden. Mit dem Start der Dienstleistung gilt der Vertrag jedoch in allen Fällen als gültig und angenommen.',
  anTitel:'Der Auftragnehmer', agTitel:'Der Auftraggeber', ort:'Ort / Datum', unterschrift:'Unterschrift',
  gf:'Geschäftsführer', al:'Abteilungsleiter', leiste:'Reinigungsvertrag',
  zeichnen:'Bitte im Feld unterschreiben', loeschen:'Löschen',
  sendenT:'Online unterschreiben und zurücksenden', ortFeld:'Ort',
  sendenTx:'Unterschreiben Sie im Feld oben und senden Sie den Vertrag mit einem Klick zurück. Selbstverständlich können Sie ihn auch ausdrucken und per Post retournieren.',
  sendenKnopf:'Unterschriebenen Vertrag senden', sendet:'Wird gesendet …',
  fehltSig:'Bitte unterschreiben Sie zuerst im Feld.',
  dankeT:'Vielen Dank', dankeTx:'Ihr unterschriebener Vertrag ist bei uns eingegangen. Eine Kopie erhalten Sie per E-Mail.',
  pech:'Konnte nicht gesendet werden:',
  fehlerT:'Dieser Link ist nicht gültig', fehler:'Bitte melden Sie sich bei uns: T 0844 355 355.'
};

function datum(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString(SPR === 'en' ? 'en-GB' : 'de-CH',
    { day:'2-digit', month:'long', year:'numeric' });
}
function stunden(txt){
  const m = String(txt || '').match(/([\d.]+)\s*(Std|hrs|Stunden|hours)/i);
  return m ? m[1] : '';
}

function fehler(){
  document.getElementById('inhalt').innerHTML =
    '<div class="fehler"><h1 style="text-transform:none;">' + T.fehlerT + '</h1><p>' + T.fehler + '</p></div>';
  document.querySelector('.leiste').style.display = 'none';
}

function zeichne(a){
  AUFTRAG = a;
  const monat = String(a.frequenz || '') === 'monatlich';
  const satz = monat ? ANSATZ.monatlich : ANSATZ.standard;
  const nr = a.angebotsnr || a.code || '';
  const name = [a.vorname, a.nachname].filter(Boolean).join(' ');
  const ort = [a.adresse, a.plzOrt || a.ort].filter(Boolean).join(', ');
  const std = stunden(a.aufwandText);
  const startTx = a.erstReinigung ? datum(a.erstReinigung)
                : a.startDatum    ? datum(a.startDatum) : '—';

  document.getElementById('leiste-tx').textContent = T.leiste + (nr ? ' Nr. ' + nr : '');
  document.getElementById('zurueck').href = 'index.html?spr=' + SPR;
  document.title = T.titel + ' ' + nr + ' – Clean Service Scaramuzzo AG';

  document.getElementById('inhalt').innerHTML =
  '<div class="blatt">' +
    '<h1>' + T.titel + ' <span>' + nr + '</span></h1>' +

    '<dl class="paar">' +
      '<dt>' + T.ag + '</dt><dd>' + name + (ort ? '<br>' + ort : '') + '</dd>' +
    '</dl>' +
    '<dl class="paar">' +
      '<dt>' + T.an + '</dt><dd>Clean Service Scaramuzzo AG<br>Industriestrasse 5, 8307 Effretikon</dd>' +
    '</dl>' +

    '<hr class="trenn">' +

    '<dl class="paar">' +
      '<dt>' + T.freq + '</dt><dd>' + ((FREQ_TEXT[SPR][a.frequenz]) || a.frequenzText || '') + '</dd>' +
      '<dt>' + T.aufwand + '</dt><dd>' + (std ? std + (SPR === 'en' ? ' hours' : ' Stunden') : '') + '</dd>' +
    '</dl>' +
    '<p class="abs klein">' + T.umfang + '</p>' +

    '<dl class="paar">' +
      '<dt>' + T.beginn + '</dt><dd style="font-weight:400;font-size:13.5px;">' + T.beginnTx + '</dd>' +
      '<dt>' + T.start + '</dt><dd>' + startTx + '</dd>' +
    '</dl>' +

    '<dl class="paar">' +
      '<dt>' + T.satz + '</dt><dd>CHF ' + satz.exkl.toFixed(2) +
        ' <span style="font-weight:400;color:var(--mute);font-size:13px;">(CHF ' +
        satz.inkl.toFixed(2) + ' ' + (SPR === 'en' ? 'incl. VAT' : 'inkl. MWST') + ')</span></dd>' +
    '</dl>' +
    '<p class="abs klein">' + T.mwst + '</p>' +
    '<p class="abs klein">' + T.agb + '</p>' +

    '<div class="wichtig">' + T.hinweis + '</div>' +

    '<div class="unter">' +
      '<div class="sp"><b>' + T.anTitel + '</b>' +
        '<div style="margin-top:10px;color:var(--mute);">Effretikon, ' + datum(new Date().toISOString()) + '</div>' +

let AUFTRAG = null;

function pdfBauen(kundenSig){
  if(!(window.jspdf && window.jspdf.jsPDF)) return null;
  const a = AUFTRAG || {};
  const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
  const L = 22, R = 188, W = R - L;
  let y = 16;

  // Briefkopf
  doc.addImage('data:image/png;base64,' + CS_LOGO, 'PNG', L, y, 46, 15.7);
  doc.setFontSize(8).setTextColor(120, 132, 131);
  doc.text('Putzfrauenservice seit 1984', R, y + 6, { align:'right' });
  doc.text('Industriestrasse 5 · 8307 Effretikon · T 0844 355 355', R, y + 10.5, { align:'right' });
  y += 22;
  doc.setDrawColor(43, 182, 183).setLineWidth(0.8).line(L, y, R, y);
  y += 12;

  const monat = String(a.frequenz || '') === 'monatlich';
  const satz = monat ? ANSATZ.monatlich : ANSATZ.standard;
  const nr = a.angebotsnr || a.code || '';
  const name = [a.vorname, a.nachname].filter(Boolean).join(' ');
  const ort = [a.adresse, a.plzOrt || a.ort].filter(Boolean).join(', ');
  const std = stunden(a.aufwandText);
  const startTx = a.erstReinigung ? datum(a.erstReinigung) : (a.startDatum ? datum(a.startDatum) : '—');

  doc.setFontSize(14).setTextColor(14, 30, 29).setFont(undefined, 'bold');
  doc.text((T.titel + ' ' + nr).toUpperCase(), L, y);
  y += 11;

  const feld = (k, v, fett) => {
    doc.setFontSize(9).setTextColor(124, 140, 139).setFont(undefined, 'normal');
    doc.text(k, L, y);
    doc.setFontSize(10.5).setTextColor(14, 30, 29).setFont(undefined, fett === false ? 'normal' : 'bold');
    const zeilen = doc.splitTextToSize(String(v), W - 48);
    doc.text(zeilen, L + 48, y);
    y += Math.max(6.5, zeilen.length * 5) + 2.5;
  };
  const absatz = (txt) => {
    doc.setFontSize(9).setTextColor(72, 86, 85).setFont(undefined, 'normal');
    const zeilen = doc.splitTextToSize(txt, W);
    doc.text(zeilen, L, y);
    y += zeilen.length * 4.4 + 4;
  };

  feld(T.ag, name + (ort ? '\n' + ort : ''));
  feld(T.an, 'Clean Service Scaramuzzo AG\nIndustriestrasse 5, 8307 Effretikon');
  doc.setDrawColor(225, 234, 233).setLineWidth(0.3).line(L, y, R, y); y += 8;

  feld(T.freq, (FREQ_TEXT[SPR][a.frequenz]) || a.frequenzText || '');
  feld(T.aufwand, std ? std + (SPR === 'en' ? ' hours' : ' Stunden') : '');
  absatz(T.umfang);
  feld(T.beginn, T.beginnTx, false);
  feld(T.start, startTx);
  feld(T.satz, 'CHF ' + satz.exkl.toFixed(2) + '  (CHF ' + satz.inkl.toFixed(2) +
       (SPR === 'en' ? ' incl. VAT)' : ' inkl. MWST)'));
  absatz(T.mwst);
  absatz(T.agb);

  // Hinweis
  doc.setFillColor(234, 246, 246).setDrawColor(207, 231, 231);
  const hz = doc.splitTextToSize(T.hinweis, W - 10);
  doc.roundedRect(L, y - 1, W, hz.length * 4.4 + 8, 2, 2, 'FD');
  doc.setFontSize(9).setTextColor(28, 120, 120).text(hz, L + 5, y + 4.5);
  y += hz.length * 4.4 + 14;

  // Unterschriften
  const sp = W / 2 - 6;
  doc.setFontSize(9.5).setTextColor(14, 30, 29).setFont(undefined, 'bold');
  doc.text(T.anTitel, L, y);
  doc.text(T.agTitel, L + sp + 12, y);
  doc.setFont(undefined, 'normal').setFontSize(8.5).setTextColor(124, 140, 139);
  doc.text('Effretikon, ' + datum(new Date().toISOString()), L, y + 5);
  doc.text(T.ort + ': ' + ((document.getElementById('v-ort') || {}).value || ''), L + sp + 12, y + 5);
  y += 9;

  const bilder = [...document.querySelectorAll('.sig-bild')];
  if(bilder[0]) doc.addImage(bilder[0].src, 'PNG', L, y, 20, 16);
  doc.setDrawColor(14, 30, 29).setLineWidth(0.3).line(L, y + 18, L + sp, y + 18);
  doc.setFontSize(8).setTextColor(124, 140, 139).text('Mirco Scaramuzzo, ' + T.gf, L, y + 22);

  if(kundenSig) doc.addImage(kundenSig, 'PNG', L + sp + 12, y, 34, 16);
  doc.line(L + sp + 12, y + 18, R, y + 18);
  doc.text(name, L + sp + 12, y + 22);

  y += 30;
  if(bilder[1]) doc.addImage(bilder[1].src, 'PNG', L, y, 30, 16);
  doc.line(L, y + 18, L + sp, y + 18);
  doc.text('Cristian Gambale, ' + T.al, L, y + 22);

  return doc.output('datauristring').split(',')[1];
}

let sigCtx = null, sigMalt = false, sigLeer = true;
function sigStart(){
  const c = document.getElementById('sig');
  if(!c) return;
  const skala = window.devicePixelRatio || 1;
  c.width  = c.offsetWidth  * skala;
  c.height = c.offsetHeight * skala;
  sigCtx = c.getContext('2d');
  sigCtx.scale(skala, skala);
  sigCtx.lineWidth = 2.2; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
  sigCtx.strokeStyle = '#1B4CA1';
  const pos = ev => {
    const r = c.getBoundingClientRect();
    const p = ev.touches ? ev.touches[0] : ev;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const anfang = ev => { ev.preventDefault(); sigMalt = true; sigLeer = false;
    const q = pos(ev); sigCtx.beginPath(); sigCtx.moveTo(q.x, q.y); };
  const zug = ev => { if(!sigMalt) return; ev.preventDefault();
    const q = pos(ev); sigCtx.lineTo(q.x, q.y); sigCtx.stroke(); };
  const ende = () => { sigMalt = false; };
  c.addEventListener('mousedown', anfang); c.addEventListener('mousemove', zug);
  window.addEventListener('mouseup', ende);
  c.addEventListener('touchstart', anfang, {passive:false});
  c.addEventListener('touchmove', zug, {passive:false});
  c.addEventListener('touchend', ende);
}
function sigLoeschen(){
  const c = document.getElementById('sig');
  if(c && sigCtx){ sigCtx.clearRect(0, 0, c.width, c.height); sigLeer = true; }
}

async function vertragSenden(){
  const mld = document.getElementById('v-mld');
  const btn = document.getElementById('v-btn');
  if(sigLeer){ mld.style.color = '#B4232C'; mld.textContent = T.fehltSig; return; }
  const c = document.getElementById('sig');
  btn.disabled = true; btn.textContent = T.sendet;
  mld.style.color = 'var(--mute)'; mld.textContent = '';
  try{
    const r = await fetch('/api/vertrag-signiert', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        id: P.get('id'), sig: P.get('sig'), spr: SPR,
        ort: (document.getElementById('v-ort') || {}).value || '',
        unterschrift: c.toDataURL('image/png'),
        // Vertrag als PDF auf dem Briefpapier, im Browser erzeugt
        pdf: pdfBauen(c.toDataURL('image/png'))
      })
    });
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.error || ('Server ' + r.status));
    document.getElementById('senden').innerHTML =
      '<h3>' + T.dankeT + '</h3><p style="margin:0;font-size:13.5px;">' + T.dankeTx + '</p>';
  }catch(e){
    mld.style.color = '#B4232C';
    mld.textContent = T.pech + ' ' + (e.message || e);
    btn.disabled = false; btn.textContent = T.sendenKnopf;
  }
}

(async function laden(){
  const id = P.get('id'), sig = P.get('sig');
  if(!id || !sig) return fehler();
  try{
    const r = await fetch('/api/orders?id=' + encodeURIComponent(id) + '&sig=' + encodeURIComponent(sig));
    if(!r.ok) return fehler();
    const d = await r.json();
    if(!d || !d.auftrag) return fehler();
    zeichne(d.auftrag);
  }catch(e){ fehler(); }
})();
